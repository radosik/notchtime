name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NotchTime.dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Tests (core + export)
        run: swift test

      - name: Upload test export (xlsx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-export
          path: build/test-export.xlsx
          if-no-files-found: ignore

      - name: Package app + dmg
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          BUILD: ${{ github.run_number }}
        run: |
          export VERSION="${VERSION#v}"
          chmod +x scripts/package.sh
          scripts/package.sh

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: NotchTime-dmg
          path: dist/NotchTime.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NotchTime.dmg
          generate_release_notes: true
