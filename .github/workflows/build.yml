name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NotchTime.dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Tests (core + export)
        run: swift test

      - name: Upload test export (xlsx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-export
          path: build/test-export.xlsx
          if-no-files-found: ignore

      - name: Version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Package app + dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: NotchTime-dmg
          path: dist/NotchTime.dmg

      # Every push to main refreshes the release for the version in ./VERSION
      # (the tag is created by the action if it does not exist yet).
      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NotchTime ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/NotchTime.dmg
          body: |
            **Install:** open the DMG, drag NotchTime to Applications, launch it.
            First launch: macOS will refuse the unsigned app once → System Settings → Privacy & Security → **Open Anyway**
            (or `xattr -dr com.apple.quarantine /Applications/NotchTime.app`). Then hover the notch.
